name: GoldScan v2

on:
  push:
    paths:
      - "gold scanner v2/**"
      - ".github/workflows/goldscan-v2.yml"
  pull_request:
    paths:
      - "gold scanner v2/**"
      - ".github/workflows/goldscan-v2.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "gold scanner v2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "gold scanner v2/package-lock.json"
      - run: npm install
      - run: npm run lint
      - run: npm test
