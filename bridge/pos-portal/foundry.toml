[profile.default]
src = "contracts"
out = "out"
test = "forge"
optimizer = true
optimizer_runs = 999999
libs = [
    "lib",
    "node_modules",
]
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@openzeppelin-v5/=lib/openzeppelin-contracts-v5/contracts",
    "forge-std/=lib/forge-std/src/",
    "hardhat/=node_modules/hardhat/",
    "truffle/=node_modules/truffle/",
    "safe-smart-account/=lib/safe-smart-account/contracts/",
]

evm_version = "shanghai"

memory_limit = 40003554432
gas_limit = "18446744073709551615"

ffi = true

fs_permissions = [{ access = "read", path = "./forge/"}, { access = "read", path = "./out/"}, { access = "read", path = "./lib/"}, { access = "read", path = "./test/"}, { access = "read", path = "./contracts/"}, { access = "read", path = "./scripts/"}, { access = "read", path = "../pos-contracts/out/"}]

[lint]
lint_on_build= false

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
mainnet = "https://mainnet.infura.io/v3/${INFURA_TOKEN}"
goerli = "https://goerli.infura.io/v3/${INFURA_TOKEN}"
sepolia = "https://sepolia.infura.io/v3/${INFURA_TOKEN}"
gilt_pos = "${GILT_POS_RPC_URL}"
gilt_testnet = "${GILT_TESTNET_RPC_URL}"
gilt_zkevm = "${GILT_ZKEVM_RPC_URL}"
gilt_zkevm_testnet = "${GILT_ZKEVM_TESTNET_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
