swagger: '2.0'
info:
  title: GiltConsensus v2 - gRPC Gateway docs
  description: A REST interface for state queries.
  version: 1.0.0
paths:
  /chainmanager/params:
    get:
      summary: GetChainManagerParams queries the chainmanager module parameters.
      operationId: GetChainManagerParams
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              params:
                description: Current chainmanager module parameters.
                type: object
                properties:
                  chain_params:
                    description: Chain configuration and contract addresses.
                    type: object
                    properties:
                      gilt_chain_id:
                        type: string
                        description: Chain ID of the Gilt (child) chain.
                      giltconsensus_chain_id:
                        type: string
                        description: Chain ID of the GiltConsensus chain.
                      slash_manager_address:
                        type: string
                        description: >-
                          Address of the slash manager contract on the root
                          chain.
                      root_chain_address:
                        type: string
                        description: >-
                          Address of the root chain contract (checkpoint
                          submission).
                      staking_info_address:
                        type: string
                        description: >-
                          Address of the staking info contract on the root
                          chain.
                      state_sender_address:
                        type: string
                        description: >-
                          Address of the state sender contract on the root
                          chain.
                      state_receiver_address:
                        type: string
                        description: >-
                          Address of the state receiver contract on the Gilt
                          chain.
                      validator_set_address:
                        type: string
                        description: >-
                          Address of the validator set contract on the root
                          chain.
                  main_chain_tx_confirmations:
                    type: string
                    format: uint64
                    description: >-
                      Number of confirmations required for main chain
                      transactions.
                  gilt_chain_tx_confirmations:
                    type: string
                    format: uint64
                    description: >-
                      Number of confirmations required for Gilt chain
                      transactions.
            description: >-
              QueryParamsResponse is the response type for the
              GetChainManagerParams query.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Query
  /checkpoints/buffer:
    get:
      summary: |-
        GetCheckpointBuffer queries the checkpoint currently in the buffer.
        The buffer holds a checkpoint while validators submit acks/no-acks.
      operationId: GetCheckpointBuffer
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              checkpoint:
                description: Checkpoint currently in the buffer awaiting finalization.
                type: object
                properties:
                  id:
                    type: string
                    format: uint64
                    description: Unique sequential identifier for this checkpoint.
                  proposer:
                    type: string
                    description: Address of the validator who proposed this checkpoint.
                  start_block:
                    type: string
                    format: uint64
                    description: >-
                      First block number included in this checkpoint
                      (inclusive).
                  end_block:
                    type: string
                    format: uint64
                    description: Last block number included in this checkpoint (inclusive).
                  root_hash:
                    type: string
                    format: byte
                    description: >-
                      Merkle root hash of all blocks in this checkpoint range.

                      This is the primary state commitment submitted to the root
                      chain.
                  gilt_chain_id:
                    type: string
                    description: Chain ID of the Gilt chain this checkpoint applies to.
                  timestamp:
                    type: string
                    format: uint64
                    description: Unix timestamp when this checkpoint was created.
            description: |-
              QueryCheckpointBufferResponse is the response type for the
              GetCheckpointBuffer query.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Query
  /checkpoints/count:
    get:
      summary: GetAckCount queries the total number of checkpoint acknowledgments.
      operationId: GetAckCount
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              ack_count:
                type: string
                format: uint64
                description: Total number of checkpoint acknowledgments.
            description: >-
              QueryAckCountResponse is the response type for the GetAckCount
              query.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Query
  /checkpoints/last-no-ack:
    get:
      summary: >-
        GetLastNoAck queries the ID of the last checkpoint that received a
        no-ack.
      operationId: GetLastNoAck
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              last_no_ack_id:
                type: string
                format: uint64
                description: ID of the last checkpoint that received a no-ack.
            description: >-
              QueryLastNoAckResponse is the response type for the GetLastNoAck
              query.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Query
  /checkpoints/latest:
    get:
      summary: GetCheckpointLatest queries the most recently finalized checkpoint.
      operationId: GetCheckpointLatest
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              checkpoint:
                description: The most recently finalized checkpoint.
                type: object
                properties:
                  id:
                    type: string
                    format: uint64
                    description: Unique sequential identifier for this checkpoint.
                  proposer:
                    type: string
                    description: Address of the validator who proposed this checkpoint.
                  start_block:
                    type: string
                    format: uint64
                    description: >-
                      First block number included in this checkpoint
                      (inclusive).
                  end_block:
                    type: string
                    format: uint64
                    description: Last block number included in this checkpoint (inclusive).
                  root_hash:
                    type: string
                    format: byte
                    description: >-
                      Merkle root hash of all blocks in this checkpoint range.

                      This is the primary state commitment submitted to the root
                      chain.
                  gilt_chain_id:
                    type: string
                    description: Chain ID of the Gilt chain this checkpoint applies to.
                  timestamp:
                    type: string
                    format: uint64
                    description: Unix timestamp when this checkpoint was created.
            description: |-
              QueryCheckpointLatestResponse is the response type for the
              GetCheckpointLatest query.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Query
  /checkpoints/list:
    get:
      summary: GetCheckpointList queries a paginated list of checkpoints.
      operationId: GetCheckpointList
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              checkpoint_list:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uint64
                      description: Unique sequential identifier for this checkpoint.
                    proposer:
                      type: string
                      description: Address of the validator who proposed this checkpoint.
                    start_block:
                      type: string
                      format: uint64
                      description: >-
                        First block number included in this checkpoint
                        (inclusive).
                    end_block:
                      type: string
                      format: uint64
                      description: >-
                        Last block number included in this checkpoint
                        (inclusive).
                    root_hash:
                      type: string
                      format: byte
                      description: >-
                        Merkle root hash of all blocks in this checkpoint range.

                        This is the primary state commitment submitted to the
                        root chain.
                    gilt_chain_id:
                      type: string
                      description: Chain ID of the Gilt chain this checkpoint applies to.
                    timestamp:
                      type: string
                      format: uint64
                      description: Unix timestamp when this checkpoint was created.
                  description: >-
                    Checkpoint represents a snapshot of the Gilt chain state at a
                    specific block

                    range. Checkpoints are periodically submitted to the root
                    chain (Ethereum) to

                    finalize the Gilt chain state and enable fraud proofs.
                description: List of checkpoints matching the query.
              pagination:
                description: Pagination response with next page token.
                type: object
                properties:
                  next_key:
                    type: string
                    format: byte
                    description: |-
                      next_key is the key to be passed to PageRequest.key to
                      query the next page most efficiently. It will be empty if
                      there are no more results.
                  total:
                    type: string
                    format: uint64
                    title: >-
                      total is total number of results available if
                      PageRequest.count_total

                      was set, its value is undefined otherwise
            description: >-
              QueryCheckpointListResponse is the response type for the
              GetCheckpointList

              query.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: pagination.key
          description: |-
            key is a value returned in PageResponse.next_key to begin
            querying the next page most efficiently. Only one of offset or key
            should be set.
          in: query
          required: false
          type: string
          format: byte
        - name: pagination.offset
          description: >-
            offset is a numeric offset that can be used when key is unavailable.

            It is less efficient than using key. Only one of offset or key
            should

            be set.
          in: query
          required: false
          type: string
          format: uint64
        - name: pagination.limit
          description: >-
            limit is the total number of results to be returned in the result
            page.

            If left empty it will default to a value to be set by each app.
          in: query
          required: false
          type: string
          format: uint64
        - name: pagination.count_total
          description: >-
            count_total is set to true  to indicate that the result set should
            include

            a count of the total number of items available for pagination in
            UIs.

            count_total is only respected when offset is used. It is ignored
            when key

            is set.
          in: query
          required: false
          type: boolean
        - name: pagination.reverse
          description: >-
            reverse is set to true if results are to be returned in the
            descending order.


            Since: cosmos-sdk 0.43
          in: query
          required: false
          type: boolean
      tags:
        - Query
  /checkpoints/overview:
    get:
      summary: |-
        GetCheckpointOverview queries an overview of checkpoint status.
        Returns ack counts, validator set, and buffer checkpoint.
      operationId: GetCheckpointOverview
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              ack_count:
                type: string
                format: uint64
                description: Total number of checkpoint acknowledgments.
              last_no_ack_id:
                type: string
                format: uint64
                description: ID of the last checkpoint that received a no-ack.
              buffer_checkpoint:
                type: object
                properties:
                  id:
                    type: string
                    format: uint64
                    description: Unique sequential identifier for this checkpoint.
                  proposer:
                    type: string
                    description: Address of the validator who proposed this checkpoint.
                  start_block:
                    type: string
                    format: uint64
                    description: >-
                      First block number included in this checkpoint
                      (inclusive).
                  end_block:
                    type: string
                    format: uint64
                    description: Last block number included in this checkpoint (inclusive).
                  root_hash:
                    type: string
                    format: byte
                    description: >-
                      Merkle root hash of all blocks in this checkpoint range.

                      This is the primary state commitment submitted to the root
                      chain.
                  gilt_chain_id:
                    type: string
                    description: Chain ID of the Gilt chain this checkpoint applies to.
                  timestamp:
                    type: string
                    format: uint64
                    description: Unix timestamp when this checkpoint was created.
                description: >-
                  Checkpoint represents a snapshot of the Gilt chain state at a
                  specific block

                  range. Checkpoints are periodically submitted to the root
                  chain (Ethereum) to

                  finalize the Gilt chain state and enable fraud proofs.
              validator_count:
                type: string
                format: uint64
                description: Total number of active validators.
              validator_set:
                description: Current validator set.
                type: object
                properties:
                  validators:
                    type: array
                    items:
                      type: object
                      properties:
                        val_id:
                          type: string
                          format: uint64
                          description: Unique identifier for this validator.
                        start_epoch:
                          type: string
                          format: uint64
                          description: Epoch when this validator becomes active.
                        end_epoch:
                          type: string
                          format: uint64
                          description: >-
                            Epoch when this validator becomes inactive. 0 means
                            no end epoch set.
                        nonce:
                          type: string
                          format: uint64
                          description: >-
                            Nonce for replay protection of validator
                            transactions.
                        voting_power:
                          type: string
                          format: int64
                          description: Voting power based on the validator's stake amount.
                        pub_key:
                          type: string
                          format: byte
                          description: Public key used for block signing on the Gilt chain.
                        signer:
                          type: string
                          description: GiltConsensus address of this validator's signer.
                        last_updated:
                          type: string
                          description: >-
                            Block height or identifier when this validator was
                            last updated.
                        jailed:
                          type: boolean
                          description: >-
                            Whether this validator is currently jailed (slashed
                            and temporarily

                            removed).
                        proposer_priority:
                          type: string
                          format: int64
                          description: >-
                            Priority value used for round-robin proposer
                            selection in Tendermint.
                      description: >-
                        Validator represents a single validator in the GiltConsensus
                        network.

                        Validators are responsible for producing blocks on the
                        Gilt chain and

                        securing the network through Proof-of-Stake consensus.
                    description: List of all validators in this set.
                  proposer:
                    type: object
                    properties:
                      val_id:
                        type: string
                        format: uint64
                        description: Unique identifier for this validator.
                      start_epoch:
                        type: string
                        format: uint64
                        description: Epoch when this validator becomes active.
                      end_epoch:
                        type: string
                        format: uint64
                        description: >-
                          Epoch when this validator becomes inactive. 0 means no
                          end epoch set.
                      nonce:
                        type: string
                        format: uint64
                        description: Nonce for replay protection of validator transactions.
                      voting_power:
                        type: string
                        format: int64
                        description: Voting power based on the validator's stake amount.
                      pub_key:
                        type: string
                        format: byte
                        description: Public key used for block signing on the Gilt chain.
                      signer:
                        type: string
                        description: GiltConsensus address of this validator's signer.
                      last_updated:
                        type: string
                        description: >-
                          Block height or identifier when this validator was
                          last updated.
                      jailed:
                        type: boolean
                        description: >-
                          Whether this validator is currently jailed (slashed
                          and temporarily

                          removed).
                      proposer_priority:
                        type: string
                        format: int64
                        description: >-
                          Priority value used for round-robin proposer selection
                          in Tendermint.
                    description: >-
                      Validator represents a single validator in the GiltConsensus
                      network.

                      Validators are responsible for producing blocks on the Gilt
                      chain and

                      securing the network through Proof-of-Stake consensus.
                  total_voting_power:
                    type: string
                    format: int64
                    description: Sum of voting power across all validators in this set.
            description: |-
              QueryCheckpointOverviewResponse is the response type for the
              GetCheckpointOverview query.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Query
  /checkpoints/params:
    get:
      summary: GetCheckpointParams queries the checkpoint module parameters.
      operationId: GetCheckpointParams
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              params:
                description: Current checkpoint module parameters.
                type: object
                properties:
                  checkpoint_buffer_time:
                    type: string
                    description: |-
                      Time buffer before a checkpoint can be finalized.
                      This allows validators time to submit acks or no-acks.
                  avg_checkpoint_length:
                    type: string
                    format: uint64
                    description: Target number of blocks to include in each checkpoint.
                  max_checkpoint_length:
                    type: string
                    format: uint64
                    description: Maximum number of blocks allowed in a single checkpoint.
                  child_chain_block_interval:
                    type: string
                    format: uint64
                    description: >-
                      Average time between blocks on the child (Gilt) chain in
                      seconds.
            description: >-
              QueryParamsResponse is the response type for the
              GetCheckpointParams query.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Query
  /checkpoints/prepare-next:
    get:
      summary: >-
        GetNextCheckpoint prepares and returns the next checkpoint to be
        proposed.
      operationId: GetNextCheckpoint
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              checkpoint:
                description: The prepared next checkpoint ready to be proposed.
                type: object
                properties:
                  proposer:
                    type: string
                    description: Address of the validator proposing this checkpoint.
                  start_block:
                    type: string
                    format: uint64
                    description: First block number included in this checkpoint.
                  end_block:
                    type: string
                    format: uint64
                    description: Last block number included in this checkpoint.
                  root_hash:
                    type: string
                    format: byte
                    description: Merkle root hash of all blocks in the checkpoint range.
                  account_root_hash:
                    type: string
                    format: byte
                    description: >-
                      Merkle root hash of all account states in the checkpoint
                      range.
                  gilt_chain_id:
                    type: string
                    description: Chain ID of the Gilt chain.
            description: >-
              QueryNextCheckpointResponse is the response type for the
              GetNextCheckpoint

              query.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Query
  /checkpoints/signatures/{tx_hash}:
    get:
      summary: >-
        GetCheckpointSignatures queries the validator signatures for a
        checkpoint.
      operationId: GetCheckpointSignatures
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              signatures:
                type: array
                items:
                  type: object
                  properties:
                    validator_address:
                      type: string
                      format: byte
                      description: Address of the validator who created this signature.
                    signature:
                      type: string
                      format: byte
                      description: Cryptographic signature over the checkpoint data.
                  description: >-
                    CheckpointSignature represents a single validator's
                    signature on a

                    checkpoint.
                description: List of validator signatures for the requested checkpoint.
            description: |-
              QueryCheckpointSignaturesResponse is the response type for the
              GetCheckpointSignatures query.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: tx_hash
          description: Transaction hash of the checkpoint to query signatures for.
          in: path
          required: true
          type: string
      tags:
        - Query
  /checkpoints/{number}:
    get:
      summary: GetCheckpoint queries a specific checkpoint by its ID number.
      operationId: GetCheckpoint
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              checkpoint:
                type: object
                properties:
                  id:
                    type: string
                    format: uint64
                    description: Unique sequential identifier for this checkpoint.
                  proposer:
                    type: string
                    description: Address of the validator who proposed this checkpoint.
                  start_block:
                    type: string
                    format: uint64
                    description: >-
                      First block number included in this checkpoint
                      (inclusive).
                  end_block:
                    type: string
                    format: uint64
                    description: Last block number included in this checkpoint (inclusive).
                  root_hash:
                    type: string
                    format: byte
                    description: >-
                      Merkle root hash of all blocks in this checkpoint range.

                      This is the primary state commitment submitted to the root
                      chain.
                  gilt_chain_id:
                    type: string
                    description: Chain ID of the Gilt chain this checkpoint applies to.
                  timestamp:
                    type: string
                    format: uint64
                    description: Unix timestamp when this checkpoint was created.
                description: >-
                  Checkpoint represents a snapshot of the Gilt chain state at a
                  specific block

                  range. Checkpoints are periodically submitted to the root
                  chain (Ethereum) to

                  finalize the Gilt chain state and enable fraud proofs.
            description: >-
              QueryCheckpointResponse is the response type for the GetCheckpoint
              query.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: number
          description: Checkpoint ID number to retrieve.
          in: path
          required: true
          type: string
          format: uint64
      tags:
        - Query
  /clerk/event-records/count:
    get:
      summary: GetRecordCount queries the total number of event records.
      operationId: GetRecordCount
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              count:
                type: string
                format: uint64
                description: Total number of event records.
            description: >-
              RecordCountResponse is the response type for the GetRecordCount
              query.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Query
  /clerk/event-records/latest-id:
    get:
      summary: >-
        GetLatestRecordId queries the latest event record ID from the root
        chain.
      operationId: GetLatestRecordId
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              latest_record_id:
                type: string
                format: uint64
                description: Latest event record ID from the root chain.
              is_processed_by_giltconsensus:
                type: boolean
                description: True if this record has been processed by GiltConsensus.
            description: >-
              LatestRecordIdResponse is the response type for the
              GetLatestRecordId query.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Query
  /clerk/event-records/list:
    get:
      summary: GetRecordList queries a paginated list of event records.
      operationId: GetRecordList
      responses:
        '200':
