        description: First block number included in this checkpoint.
      end_block:
        type: string
        format: uint64
        description: Last block number included in this checkpoint.
      root_hash:
        type: string
        format: byte
        description: Merkle root hash of all blocks in the checkpoint range.
      account_root_hash:
        type: string
        format: byte
        description: Merkle root hash of all account states in the checkpoint range.
      gilt_chain_id:
        type: string
        description: Chain ID of the Gilt chain.
    description: MsgCheckpoint defines the message for proposing a new checkpoint.
  giltconsensusv2.checkpoint.Params:
    type: object
    properties:
      checkpoint_buffer_time:
        type: string
        description: |-
          Time buffer before a checkpoint can be finalized.
          This allows validators time to submit acks or no-acks.
      avg_checkpoint_length:
        type: string
        format: uint64
        description: Target number of blocks to include in each checkpoint.
      max_checkpoint_length:
        type: string
        format: uint64
        description: Maximum number of blocks allowed in a single checkpoint.
      child_chain_block_interval:
        type: string
        format: uint64
        description: Average time between blocks on the child (Gilt) chain in seconds.
    description: Params defines the parameters for the checkpoint module.
  giltconsensusv2.checkpoint.QueryAckCountResponse:
    type: object
    properties:
      ack_count:
        type: string
        format: uint64
        description: Total number of checkpoint acknowledgments.
