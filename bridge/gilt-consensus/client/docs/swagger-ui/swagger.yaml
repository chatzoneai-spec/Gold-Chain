      params:
        description: Current chainmanager module parameters.
        type: object
        properties:
          chain_params:
            description: Chain configuration and contract addresses.
            type: object
            properties:
              gilt_chain_id:
                type: string
                description: Chain ID of the Gilt (child) chain.
              giltconsensus_chain_id:
                type: string
                description: Chain ID of the GiltConsensus chain.
              slash_manager_address:
                type: string
                description: Address of the slash manager contract on the root chain.
              root_chain_address:
                type: string
                description: Address of the root chain contract (checkpoint submission).
              staking_info_address:
                type: string
                description: Address of the staking info contract on the root chain.
              state_sender_address:
                type: string
                description: Address of the state sender contract on the root chain.
              state_receiver_address:
                type: string
                description: Address of the state receiver contract on the Gilt chain.
              validator_set_address:
                type: string
                description: Address of the validator set contract on the root chain.
          main_chain_tx_confirmations:
            type: string
            format: uint64
            description: Number of confirmations required for main chain transactions.
          gilt_chain_tx_confirmations:
            type: string
            format: uint64
            description: Number of confirmations required for Gilt chain transactions.
    description: >-
      QueryParamsResponse is the response type for the GetChainManagerParams
      query.
  giltconsensusv2.checkpoint.Checkpoint:
    type: object
    properties:
      id:
        type: string
        format: uint64
        description: Unique sequential identifier for this checkpoint.
      proposer:
        type: string
        description: Address of the validator who proposed this checkpoint.
      start_block:
        type: string
        format: uint64
        description: First block number included in this checkpoint (inclusive).
      end_block:
        type: string
        format: uint64
        description: Last block number included in this checkpoint (inclusive).
      root_hash:
        type: string
        format: byte
        description: |-
          Merkle root hash of all blocks in this checkpoint range.
          This is the primary state commitment submitted to the root chain.
      gilt_chain_id:
        type: string
        description: Chain ID of the Gilt chain this checkpoint applies to.
      timestamp:
        type: string
        format: uint64
        description: Unix timestamp when this checkpoint was created.
    description: >-
      Checkpoint represents a snapshot of the Gilt chain state at a specific
      block

      range. Checkpoints are periodically submitted to the root chain (Ethereum)
      to

      finalize the Gilt chain state and enable fraud proofs.
  giltconsensusv2.checkpoint.CheckpointSignature:
    type: object
    properties:
      validator_address:
        type: string
        format: byte
        description: Address of the validator who created this signature.
      signature:
        type: string
        format: byte
        description: Cryptographic signature over the checkpoint data.
    description: |-
      CheckpointSignature represents a single validator's signature on a
      checkpoint.
  giltconsensusv2.checkpoint.MsgCheckpoint:
    type: object
    properties:
      proposer:
        type: string
