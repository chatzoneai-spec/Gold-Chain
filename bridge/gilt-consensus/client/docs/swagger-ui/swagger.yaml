  giltconsensusv2.checkpoint.QueryCheckpointListResponse:
    type: object
    properties:
      checkpoint_list:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              format: uint64
              description: Unique sequential identifier for this checkpoint.
            proposer:
              type: string
              description: Address of the validator who proposed this checkpoint.
            start_block:
              type: string
              format: uint64
              description: First block number included in this checkpoint (inclusive).
            end_block:
              type: string
              format: uint64
