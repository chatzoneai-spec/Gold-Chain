                description: Merkle proof for the requested account.
                type: object
                properties:
                  address:
                    type: string
                    description: Address of the account this proof is for.
                  account_proof:
                    type: string
                    format: byte
                    description: Merkle proof data for this account's balance.
                  index:
                    type: string
                    format: uint64
                    description: Index of this account in the merkle tree.
            description: |-
              QueryAccountProofResponse is the response type for the
              GetAccountProofByAddress query.
        default:
