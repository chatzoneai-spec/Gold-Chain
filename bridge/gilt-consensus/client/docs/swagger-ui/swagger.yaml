definitions:
  cosmos.base.query.v1beta1.PageRequest:
    type: object
    properties:
      key:
        type: string
        format: byte
        description: |-
          key is a value returned in PageResponse.next_key to begin
          querying the next page most efficiently. Only one of offset or key
          should be set.
      offset:
        type: string
        format: uint64
        description: |-
          offset is a numeric offset that can be used when key is unavailable.
          It is less efficient than using key. Only one of offset or key should
          be set.
      limit:
        type: string
        format: uint64
        description: >-
          limit is the total number of results to be returned in the result
          page.

          If left empty it will default to a value to be set by each app.
      count_total:
        type: boolean
        description: >-
          count_total is set to true  to indicate that the result set should
          include

          a count of the total number of items available for pagination in UIs.

          count_total is only respected when offset is used. It is ignored when
          key

          is set.
      reverse:
        type: boolean
        description: >-
          reverse is set to true if results are to be returned in the descending
          order.


          Since: cosmos-sdk 0.43
    description: |-
      message SomeRequest {
               Foo some_parameter = 1;
               PageRequest pagination = 2;
       }
    title: |-
      PageRequest is to be embedded in gRPC request messages for efficient
      pagination. Ex:
  cosmos.base.query.v1beta1.PageResponse:
    type: object
    properties:
      next_key:
        type: string
        format: byte
        description: |-
          next_key is the key to be passed to PageRequest.key to
          query the next page most efficiently. It will be empty if
          there are no more results.
      total:
        type: string
        format: uint64
        title: |-
          total is total number of results available if PageRequest.count_total
          was set, its value is undefined otherwise
    description: |-
      PageResponse is to be embedded in gRPC response messages where the
      corresponding request message has used PageRequest.

       message SomeResponse {
               repeated Bar results = 1;
               PageResponse page = 2;
       }
  google.protobuf.Any:
    type: object
    properties:
      type_url:
        type: string
      value:
        type: string
        format: byte
  grpc.gateway.runtime.Error:
    type: object
    properties:
      error:
        type: string
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          type: object
          properties:
            type_url:
              type: string
            value:
              type: string
              format: byte
  giltconsensusv2.stake.Validator:
    type: object
    properties:
      val_id:
        type: string
        format: uint64
        description: Unique identifier for this validator.
      start_epoch:
        type: string
        format: uint64
        description: Epoch when this validator becomes active.
      end_epoch:
        type: string
        format: uint64
        description: Epoch when this validator becomes inactive. 0 means no end epoch set.
      nonce:
        type: string
        format: uint64
        description: Nonce for replay protection of validator transactions.
      voting_power:
        type: string
        format: int64
        description: Voting power based on the validator's stake amount.
      pub_key:
        type: string
        format: byte
        description: Public key used for block signing on the Gilt chain.
      signer:
        type: string
        description: GiltConsensus address of this validator's signer.
      last_updated:
        type: string
        description: Block height or identifier when this validator was last updated.
      jailed:
        type: boolean
        description: |-
          Whether this validator is currently jailed (slashed and temporarily
          removed).
      proposer_priority:
        type: string
        format: int64
        description: Priority value used for round-robin proposer selection in Tendermint.
    description: |-
      Validator represents a single validator in the GiltConsensus network.
      Validators are responsible for producing blocks on the Gilt chain and
      securing the network through Proof-of-Stake consensus.
  giltconsensusv2.stake.ValidatorSet:
    type: object
    properties:
      validators:
        type: array
        items:
          type: object
          properties:
            val_id:
              type: string
              format: uint64
              description: Unique identifier for this validator.
            start_epoch:
              type: string
              format: uint64
              description: Epoch when this validator becomes active.
            end_epoch:
              type: string
              format: uint64
              description: >-
                Epoch when this validator becomes inactive. 0 means no end epoch
                set.
            nonce:
              type: string
              format: uint64
              description: Nonce for replay protection of validator transactions.
            voting_power:
              type: string
              format: int64
              description: Voting power based on the validator's stake amount.
            pub_key:
              type: string
              format: byte
              description: Public key used for block signing on the Gilt chain.
            signer:
              type: string
              description: GiltConsensus address of this validator's signer.
            last_updated:
              type: string
              description: Block height or identifier when this validator was last updated.
            jailed:
              type: boolean
              description: >-
                Whether this validator is currently jailed (slashed and
                temporarily

                removed).
            proposer_priority:
              type: string
              format: int64
              description: >-
                Priority value used for round-robin proposer selection in
                Tendermint.
          description: |-
            Validator represents a single validator in the GiltConsensus network.
            Validators are responsible for producing blocks on the Gilt chain and
            securing the network through Proof-of-Stake consensus.
        description: List of all validators in this set.
      proposer:
        type: object
        properties:
          val_id:
            type: string
            format: uint64
            description: Unique identifier for this validator.
          start_epoch:
            type: string
            format: uint64
            description: Epoch when this validator becomes active.
          end_epoch:
            type: string
            format: uint64
            description: >-
              Epoch when this validator becomes inactive. 0 means no end epoch
              set.
          nonce:
            type: string
            format: uint64
            description: Nonce for replay protection of validator transactions.
          voting_power:
            type: string
            format: int64
            description: Voting power based on the validator's stake amount.
          pub_key:
            type: string
            format: byte
            description: Public key used for block signing on the Gilt chain.
          signer:
            type: string
            description: GiltConsensus address of this validator's signer.
          last_updated:
            type: string
            description: Block height or identifier when this validator was last updated.
          jailed:
            type: boolean
            description: >-
              Whether this validator is currently jailed (slashed and
              temporarily

              removed).
          proposer_priority:
            type: string
            format: int64
            description: >-
              Priority value used for round-robin proposer selection in
              Tendermint.
        description: |-
          Validator represents a single validator in the GiltConsensus network.
          Validators are responsible for producing blocks on the Gilt chain and
          securing the network through Proof-of-Stake consensus.
      total_voting_power:
        type: string
        format: int64
        description: Sum of voting power across all validators in this set.
    description: >-
      ValidatorSet represents a complete set of validators at a specific point
      in

      time. This is used for consensus and includes the designated block
      proposer.
  giltconsensusv2.chainmanager.ChainParams:
    type: object
